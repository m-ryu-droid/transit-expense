<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交通費トラッカー</title>
  <style>
    /* スタイル部分は変更ないのでそのまま維持（中略） */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f3; --surface: #ffffff; --surface2: #f0efea;
      --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
      --text: #1a1a18; --text2: #6b6b66; --text3: #9e9e98;
      --green: #1D9E75; --green-light: #E1F5EE; --green-mid: #5DCAA5;
      --green-dark: #085041; --green-text: #0F6E56;
      --radius: 12px; --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a; --surface: #262624; --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
        --text: #f0efea; --text2: #a0a09a; --text3: #666662;
        --green-light: #0a3328; --green-text: #5DCAA5;
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1rem; }
    .container { max-width: 560px; margin: 0 auto; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; padding-top: 0.5rem; }
    .header-icon { width: 36px; height: 36px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .header-icon svg { width: 20px; height: 20px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 20px; font-weight: 600; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .full { grid-column: 1 / -1; }
    label { font-size: 13px; color: var(--text2); font-weight: 500; }
    input, select { font-size: 15px; padding: 9px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); width: 100%; outline: none; }
    .route-row { display: flex; align-items: center; gap: 6px; }
    .maps-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--green-text); border: 0.5px solid var(--green-mid); border-radius: 20px; padding: 6px 10px; background: var(--green-light); cursor: pointer; text-decoration: none; }
    .transport-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .tp { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 7px 13px; border: 0.5px solid var(--border2); border-radius: 20px; cursor: pointer; }
    .tp.on { background: var(--green-light); border-color: var(--green); color: var(--green-dark); font-weight: 600; }
    .amount-input-row { display: flex; align-items: center; gap: 8px; }
    .btn-add { width: 100%; padding: 11px; background: var(--green); color: white; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; }
    .entry-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface2); border-radius: var(--radius-sm); margin-bottom: 8px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: #9FE1CB; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #085041; }
    .slack-section { border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; background: var(--surface); margin-bottom: 2rem; }
    .btn-slack { padding: 9px 16px; background: #4A154B; color: white; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
    .preview-box { margin-top: 12px; background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; white-space: pre-wrap; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: var(--radius-sm); opacity: 0; transition: opacity 0.3s; z-index: 999; }
    .toast.ok { background: var(--green); color: white; }
    .toast.ng { background: #e24b4a; color: white; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-icon"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
    <h1>交通費トラッカー</h1>
  </div>

  <div class="card">
    <div class="form-grid">
      <div class="form-group"><label>名前</label><input type="text" id="inp-name" placeholder="例：田中 太郎" /></div>
      <div class="form-group"><label>日付</label><input type="date" id="inp-date" /></div>
      <div class="form-group full">
        <label>出発地 → 目的地</label>
        <div class="route-row">
          <input type="text" id="inp-from" placeholder="出発地" />
          <span>→</span>
          <input type="text" id="inp-to" placeholder="目的地" />
          <button class="maps-btn" onclick="openMaps()">地図</button>
        </div>
      </div>
      <div class="form-group full">
        <label>交通手段</label>
        <div class="transport-row">
          <div class="tp on" data-val="電車" onclick="selectTP(this)">🚃 電車</div>
          <div class="tp" data-val="バス" onclick="selectTP(this)">🚌 バス</div>
          <div class="tp" data-val="その他" onclick="selectTP(this)">🔖 その他</div>
        </div>
      </div>
      <div class="form-group full">
        <label>金額（円）</label>
        <input type="number" id="inp-amount" placeholder="金額を入力" />
      </div>
    </div>
    <button class="btn-add" onclick="addEntry()">追加する</button>
  </div>

  <div id="entries-section" style="display:none;">
    <div class="summary">
      <div class="stat"><div id="stat-count">0件</div></div>
      <div class="stat"><div id="stat-total">¥0</div></div>
    </div>
    <div id="entry-list"></div>
  </div>

  <div class="slack-section">
    <button class="btn-slack" id="btn-send" onclick="sendToSlack()">Slackへ送信</button>
    <div id="preview-area"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const entries = [];
  let transport = '電車';
  // あなたのGASのURL
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwLfLgHeMpPX90B6cKjvkxrIYgGI-RVOGc9FLZCbotsNsgV83RZ9-N_tfaQns5dtMcBsQ/exec';

  document.getElementById('inp-date').value = new Date().toISOString().split('T')[0];

  function selectTP(el) {
    document.querySelectorAll('.tp').forEach(t => t.classList.remove('on'));
    el.classList.add('on');
    transport = el.dataset.val;
  }

  function addEntry() {
    const name = document.getElementById('inp-name').value.trim();
    const from = document.getElementById('inp-from').value.trim();
    const to = document.getElementById('inp-to').value.trim();
    const amount = parseInt(document.getElementById('inp-amount').value);
    const date = document.getElementById('inp-date').value;

    if (!name || !from || !to || !amount) { showToast('入力してください', 'ng'); return; }
    entries.push({ name, date, from, to, amount, transport });
    renderEntries();
    updatePreview();
    showToast('追加しました！', 'ok');
  }

  function renderEntries() {
    const section = document.getElementById('entries-section');
    section.style.display = entries.length ? 'block' : 'none';
    const total = entries.reduce((s, e) => s + e.amount, 0);
    document.getElementById('stat-count').textContent = entries.length + '件';
    document.getElementById('stat-total').textContent = '¥' + total.toLocaleString();
    document.getElementById('entry-list').innerHTML = entries.map((e, i) => `
      <div class="entry-item">
        <div style="flex:1"><b>${e.name}</b><br><small>${e.from}→${e.to}</small></div>
        <div>¥${e.amount.toLocaleString()}</div>
      </div>
    `).join('');
  }

  function buildSlackMsg() {
    if (!entries.length) return null;
    let txt = '*交通費報告*\n';
    entries.forEach(e => { txt += `• ${e.name}: ${e.from}→${e.to} ¥${e.amount}\n`; });
    return txt;
  }

  function updatePreview() {
    const msg = buildSlackMsg();
    document.getElementById('preview-area').innerHTML = msg ? `<div class="preview-box">${msg}</div>` : '';
  }

  async function sendToSlack() {
    const msg = buildSlackMsg();
    if (!msg) { showToast('データがありません', 'ng'); return; }

    const btn = document.getElementById('btn-send');
    btn.disabled = true;
    btn.textContent = '送信中...';

    try {
      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ text: msg })
      });
      showToast('Slackに送信しました！', 'ok');
    } catch (e) {
      showToast('エラーが発生しました', 'ng');
    }
    btn.disabled = false;
    btn.textContent = 'Slackへ送信';
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function openMaps() {
    const from = document.getElementById('inp-from').value;
    const to = document.getElementById('inp-to').value;
    window.open(`https://www.google.com/maps/dir/${from}/${to}/`, '_blank');
  }
</script>
</body>
</html>
